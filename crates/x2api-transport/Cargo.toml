parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
metrics-util = { version = "0.20.4", features = ["debugging"] }
