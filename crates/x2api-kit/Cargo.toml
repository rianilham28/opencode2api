[package]
name = "x2api-kit"
description = "Framework-agnostic shared surface for the x2api template: provider seam, wire types, SSE framing, errors, config, telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
memchr = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
anyhow = { workspace = true }
jiff = { workspace = true }
dotenvy = "0.15.7"

[dev-dependencies]
# Test-only: asserting a published gauge against a real recorder. Same pin as
# `x2api-server`; `debugging` is the feature that makes the snapshot inspectable.
metrics-util = { version = "0.20.4", features = ["debugging"] }
