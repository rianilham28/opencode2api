[package]
name = "opencode2api-server"
description = "The generic HTTP surface of the opencode2api template: router, pipeline (auth gate, admission, retry), SSE relay, per-format error rendering, graceful drain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
opencode2api-kit = { workspace = true }
opencode2api-dialects = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
memchr = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
tower = { version = "0.5", features = ["util"] }
metrics-util = { version = "0.20.4", features = ["debugging"] }
tracing-subscriber = { workspace = true }
