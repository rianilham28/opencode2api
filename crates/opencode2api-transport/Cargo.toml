[package]
name = "opencode2api-transport"
description = "Upstream egress for opencode2api services: warm connection lanes over sticky proxy sessions, rotated before expiry, sharded on demand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
opencode2api-kit = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
boring = { workspace = true }
tokio-boring = { workspace = true }
async-compression = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
webpki-root-certs = { workspace = true }
http = { workspace = true }

[dev-dependencies]
md5 = "0.7"
metrics-util = { version = "0.20.4", features = ["debugging"] }
